<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Atmosfera 4.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Atmosfera 4.0</h1>
        <p>Painel de Monitoramento Meteorológico - SENAI</p>
    </header>

    <main class="principal">

        <section class="grade-cartoes">
            <div class="cartao">
                <h3>Temperatura</h3>
                <p class="valor">24.5 °C</p>
            </div>

            <div class="cartao">
                <h3>Umidade</h3>
                <p class="valor">65 %</p>
            </div>

            <div class="cartao">
                <h3>Pressão</h3>
                <p class="valor">1013 hPa</p>
            </div>

            <div class="cartao">
                <h3>Luminosidade</h3>
                <p class="valor">850 Lux</p>
            </div>
        </section>

        <section class="caixa-grafico">
            <h2>Histórico das Últimas 24 Horas</h2>
            <canvas id="grafico-temperatura"></canvas>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
